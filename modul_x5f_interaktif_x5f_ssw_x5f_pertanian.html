t (teebukuro), apron tahan kimia, sepatu boot panjang.","Larangan mutlak saat semprot pestisida: dilarang merokok, makan, minum, menyentuh wajah. Cuci tangan dan ganti baju setelah selesai.","Pemeriksaan traktor sebelum operasi (tenken): rem berfungsi, oli cukup, bahan bakar tidak bocor, baut roda kencang, lampu & klakson nyala, tidak ada retak.","Jika keracunan pestisida: segera hentikan kerja, bawa ke udara segar, lepas pakaian terkontaminasi, cuci kulit dengan air mengalir, bawa label pestisida ke dokter.","Pahami tanda bahaya: tengkorak = racun mematikan, api = mudah terbakar, silang merah = berbahaya bagi kesehatan."],memory:[{title:"Checklist APD Wajib",type:"cards",data:[{name:"Boushi / Helmet",desc:"Lindungi kepala dari jatuh & sinar",icon:"⛑️"},{name:"Goggle / Kacamata",desc:"Cegah cipratan nouyaku ke mata",icon:"\uD83E\uDD7D"},{name:"Masker",desc:"Masker khusus pestisida, bukan masker kain",icon:"\uD83D\uDE37"},{name:"Teebukuro Karet",desc:"Tahan kimia, panjang sampai siku",icon:"\uD83E\uDDE4"},{name:"Apron & Boots",desc:"Apron plastik + boot karet tinggi",icon:"\uD83D\uDC62"}]},{title:"Tenken Traktor - 5 Poin Hafalan",type:"table",data:{headers:["Cek","Cara","NG jika"],rows:[["Brake / Bureeki","Injak rem, harus pakem","Rem blong / bunyi"],["Oli & BBM","Cek level & kebocoran","Rembes / bau bensin kuat"],["Baut Roda","Kencangkan dengan kunci","Kendor / karat parah"],["Lampu","Nyalakan lampu depan/belakang","Mati / redup"],["Ban & Body","Lihat retak & tekanan angin","Retak dalam / kempes"]]}}],vocab:[{jp:"安全",kana:"あんぜん",id:"Anzen - Keselamatan",note:"Paling sering keluar"},{jp:"保護具",kana:"ほごぐ",id:"Hogogu - APD"},{jp:"手袋",kana:"てぶくろ",id:"Teebukuro - Sarung tangan"},{jp:"農薬",kana:"のうやく",id:"Nouyaku - Pestisida"},{jp:"点検",kana:"てんけん",id:"Tenken - Pemeriksaan"}],quiz:[{q:"Saat menyemprot nouyaku, mana yang DILARANG keras?",options:["Memakai teebukuro karet","Merokok dan makan di area semprot","Memakai masker khusus","Mencuci tangan setelah selesai"],correct:1,explain:"Merokok/makan/minum saat semprot bisa menyebabkan pestisida masuk lewat mulut. Ini pelanggaran keselamatan fatal di ujian."},{q:"Urutan P3K keracunan pestisida yang benar adalah...",options:["Minum susu lalu lanjut kerja","Pindah ke udara segar, lepas baju terkontaminasi, cuci kulit, bawa label ke dokter","Oleskan minyak angin","Tunggu 1 jam baru lapor"],correct:1,explain:"Jawaban resmi SSW: evakuasi + dekontaminasi + bawa bukti label nouyaku agar dokter tahu antidotnya."},{q:"Cek traktor sebelum kerja TIDAK termasuk...",options:["Cek rem dan lampu","Cek oli dan BBM bocor","Cek warna cat traktor masih mengkilap","Cek baut roda kencang"],correct:2,explain:"Warna cat tidak relevan. Yang diuji adalah fungsi keselamatan, bukan estetika."},{q:"Tanda tengkorak ☠️ pada botol pestisida artinya?",options:["Pupuk organik","Racun sangat berbahaya, bisa mati jika tertelan/terhirup","Aman untuk sayur","Mudah terbakar"],correct:1,explain:"Tengkorak = doku - racun mematikan. Selalu pakai APD lengkap."},{q:"Setelah selesai semprot, apa yang wajib dilakukan?",options:["Langsung makan siang","Cuci APD dan tubuh dengan sabun, ganti pakaian","Simpan sisa nouyaku di botol minum","Buang sisa ke sungai"],correct:1,explain:"Dekontaminasi wajib. Sisa nouyaku tidak boleh dipindah ke botol makanan dan tidak boleh dibuang ke sungai."},{q:"Kenapa tidak boleh pakai masker kain biasa saat semprot insektisida?",options:["Karena tidak modis","Karena tidak menyaring uap kimia halus","Karena mahal","Karena panas"],correct:1,explain:"Harus masker khusus dengan filter karbon untuk nouyaku. Masker kain tidak menahan partikel kimia."}],tips:["Hafal 5 cek traktor dengan jembatan: Re-O-Ba-La-Ba (Rem, Oli, Baut, Lampu, Ban).","Soal P3K selalu jawab: hentikan kerja + bawa label ke dokter.","APD = jawaban aman jika ragu di soal keselamatan."]},{id:"B",label:"Varietas & Karakteristik",short:"B",icon:Pr,summary:["Ciri benih unggul: daya kecambah >85%, murni tidak tercampur, bebas hama penyakit, ukuran seragam, tahan kondisi lokal.","Tanaman musim panas (natsuyasai): tomat, terong (nasu), timun (kyuuri), jagung, semangka, melon - butuh suhu tinggi & sinar kuat.","Tanaman musim dingin (fuyuyasai): kubis (kyabetsu), brokoli, hakusai, hourensou, daikon - tahan dingin, tumbuh di suhu rendah.","Famili penting: Solanaceae (terong-terongan), Cucurbitaceae (labu-labuan), Brassicaceae (kubis-kubisan). Rotasi harus beda famili!"],memory:[{title:"3 Famili Wajib Hafal",type:"table",data:{headers:["Famili","Ciri","Contoh"],rows:[["Solanaceae","Bunga bintang 5, buah buni","Tomat, Nasu, Jagung? no - Kentang, Paprika"],["Cucurbitaceae","Merambat, buah besar berair","Kyuuri, Kabocha, Suika, Melon"],["Brassicaceae","Bunga 4 kelopak silang","Kyabetsu, Broccoli, Hakusai, Daikon"]]}},{title:"Benih Unggul - Yoi Tane",type:"cards",data:[{name:"Hatsuga 85%+",desc:"Daya kecambah tinggi",icon:"\uD83C\uDF31"},{name:"Seiketsu",desc:"Bebas penyakit & kotoran",icon:"\uD83D\uDD2C"},{name:"Soroi",desc:"Ukuran seragam",icon:"⚖️"},{name:"Tekio",desc:"Cocok iklim lokal",icon:"\uD83D\uDDFE"}]}],vocab:[{jp:"種",kana:"たね",id:"Tane - Benih"},{jp:"苗",kana:"なえ",id:"Nae - Bibit"},{jp:"夏野菜",kana:"なつやさい",id:"Natsuyasai - Sayur musim panas"},{jp:"冬野菜",kana:"ふゆやさい",id:"Fuyuyasai - Sayur musim dingin"},{jp:"品種",kana:"ひんしゅ",id:"Hinshu - Varietas"}],quiz:[{q:"Ciri benih unggul yang benar adalah...",options:["Campur varietas lain biar beragam","Daya kecambah rendah tapi murah","Murni, daya kecambah tinggi >85%, bebas penyakit","Ukuran tidak seragam tidak masalah"],correct:2,explain:"Definisi resmi: junsei (murni), hatsuga ritsu tinggi, byouki nashi."},{q:"Manakah termasuk Solanaceae?",options:["Kyuuri dan Suika","Kyabetsu dan Brokoli","Tomat, Nasu, Piman","Daikon dan Hakusai"],correct:2,explain:"Solanaceae = nasu family. Ingat To-Na-Pi (Tomat-Nasu-Piman)."},{q:"Tanaman musim dingin yang tahan dingin adalah...",options:["Suika dan Melon","Hourensou dan Kyabetsu","Tomat dan Nasu","Jagung manis"],correct:1,explain:"Fuyuyasai = kubis-kubisan dan bayam jepang yang tahan dingin."},{q:"Kenapa rotasi tanaman harus beda famili?",options:["Biar warna kebun bagus","Mencegah penumpukan hama spesifik & kelelahan tanah","Karena atasan suruh","Supaya panen lebih cepat"],correct:1,explain:"Hama spesifik famili akan menumpuk jika tanam famili sama terus-menerus."},{q:"Kyuuri termasuk famili...",options:["Solanaceae","Cucurbitaceae","Brassicaceae","Poaceae"],correct:1,explain:"Kyuuri = timun = labu-labuan = Cucurbitaceae. Merambat dan buah berair."}],tips:["Hafal contoh dengan singkatan: So-To-Na (Solanaceae), Cu-Kyu-Sui (Cucurbitaceae), Bu-Kya-Bu (Brassicaceae).","Soal musim: kalau ada kata 'atsui' (panas) jawab natsuyasai, 'samui' (dingin) jawab fuyuyasai."]},{id:"C",label:"Lingkungan Tanam",short:"C",icon:_r,summary:["Greenhouse (hausu / onshitsu): menjaga suhu, mengontrol kelembapan, melindungi dari hujan angin & hama, memperpanjang musim tanam.","Suhu ideal: natsuyasai 20-30°C, fuyuyasai 15-20°C. Kelembapan ideal 60-80%. Suhu >35°C sebabkan pertumbuhan terhambat & buah rontok.","Alat penting: kuwa (cangkul jepang), kama (sabit), jooro (gembor), sprayer (sanpuki), mulsa sheet (maruchi), traktor (torakuta).","Mulsa fungsi: jaga kelembapan tanah, cegah gulma, jaga suhu tanah stabil, cegah percikan tanah ke daun."],memory:[{title:"Alat & Fungsi - Nouki",type:"cards",data:[{name:"Kuwa",desc:"Cangkul untuk gemburkan tanah",icon:"\uD83E\uDE93"},{name:"Sanpuki / Sprayer",desc:"Semprot nouyaku & hirou cair",icon:"\uD83E\uDDF4"},{name:"Maruchi / Mulsa",desc:"Tutup tanah hitam/perak",icon:"⬛"},{name:"Jooro",desc:"Penyiraman manual bibit",icon:"\uD83D\uDEBF"},{name:"Torakuta",desc:"Olah tanah skala besar",icon:"\uD83D\uDE9C"}]},{title:"Suhu Ideal Hafalan",type:"table",data:{headers:["Kondisi","Ideal","Bahaya jika lewat"],rows:[["Natsuyasai","20-30°C",">35°C layu & bunga rontok"],["Fuyuyasai","15-20°C","<5°C beku, >25°C bolting"],["Kelembapan","60-80%",">90% jamur, <40% kering"],["Hausu siang","25-28°C",">35°C buka ventilasi"]]}}],vocab:[{jp:"ハウス",kana:"はうす",id:"Hausu - Greenhouse"},{jp:"温度",kana:"おんど",id:"Ondo - Suhu"},{jp:"湿度",kana:"しつど",id:"Shitsudo - Kelembapan"},{jp:"鍬",kana:"くわ",id:"Kuwa - Cangkul"},{jp:"マルチ",kana:"まるち",id:"Maruchi - Mulsa"}],quiz:[{q:"Fungsi utama hausu (greenhouse) adalah...",options:["Untuk pamer","Mengontrol suhu & kelembapan dan lindungi dari hama/hujan","Membuat tanaman cepat mati","Tempat istirahat"],correct:1,explain:"Hausu = onshitsu untuk kontrol lingkungan dan perpanjangan musim."},{q:"Jika suhu di hausu siang >35°C, apa yang harus dilakukan?",options:["Tutup rapat semua ventilasi","Buka ventilasi / kipas untuk turunkan suhu","Siram dengan air panas","Biarkan saja"],correct:1,explain:"Suhu tinggi sebabkan stress. Ventilasi = kanki adalah jawaban standar."},{q:"Fungsi mulsa (maruchi) yang TIDAK benar...",options:["Menjaga kelembapan tanah","Mencegah gulma tumbuh","Membuat tanah semakin kering dan pecah","Menjaga suhu tanah stabil"],correct:2,explain:"Mulsa justru menjaga kelembapan, bukan mengeringkan."},{q:"Alat untuk menyemprot pestisida cair adalah...",options:["Kuwa","Sanpuki / Sprayer","Kama","Jooro"],correct:1,explain:"Sanpuki = sprayer. Kuwa cangkul, kama sabit, jooro gembor kecil."},{q:"Kelembapan >90% terus-menerus menyebabkan...",options:["Tanaman sangat sehat","Mudah timbul jamur (kabimono) dan penyakit","Buah jadi manis","Tanah jadi subur"],correct:1,explain:"Kelembapan tinggi = surga jamur. Makanya perlu ventilasi."}],tips:["Soal greenhouse: jika ada kata 'atsui' / panas -> jawab 'kanki suru' (ventilasi).","Hafal maruchi = 3 fungsi: shitsudo hoji + zassou boushi + ondo antei."]},{id:"D",label:"Metode Tanam & Manajemen",short:"D",icon:Tr,summary:["Jarak tanam (shokuzuke kyori): terlalu rapat = kurang cahaya & sirkulasi, mudah penyakit. Terlalu jarang = boros lahan.","Penjarangan (tekikan / mabiki): cabut bibit yang lemah agar yang kuat tumbuh optimal. Dilakukan saat daun sejati 2-3 lembar.","Pemangkasan (teishin / tekishin / mekaki): buang tunas samping agar nutrisi fokus ke buah utama. Penting untuk tomat & timun.","Pengairan: tetes (tenteki) hemat air & tepat sasaran, sprinkler (sanpou) untuk area luas. Siram pagi/sore, hindari siang terik.","Rotasi tanaman: jangan tanam famili sama berturut-turut di lahan sama. Selang dengan legum (mame) untuk perbaiki nitrogen."],memory:[{title:"Teknik Kunci",type:"cards",data:[{name:"Mabiki / Tekikan",desc:"Penjarangan, buang bibit lemah",icon:"\uD83C\uDF3F"},{name:"Teishin",desc:"Potong pucuk utama hentikan tinggi",icon:"✂️"},{name:"Mekaki",desc:"Buang tunas ketiak (waki me)",icon:"\uD83C\uDF31"},{name:"Tenteki Kansui",desc:"Irigasi tetes hemat air",icon:"\uD83D\uDCA7"},{name:"Rinsaku",desc:"Rotasi tanaman beda famili",icon:"\uD83D\uDD04"}]},{title:"Jarak & Waktu",type:"table",data:{headers:["Teknik","Kapan","Tujuan"],rows:[["Mabiki","Daun sejati 2-3","Beri ruang tumbuh"],["Mekaki","Tunas 5-10cm","Fokus nutrisi ke buah"],["Kansui","Pagi 6-9 / Sore 16-18","Hindari penguapan & jamur"],["Rinsaku","Setiap musim","Putus siklus hama"]]}}],vocab:[{jp:"間引き",kana:"まびき",id:"Mabiki - Penjarangan"},{jp:"摘芯",kana:"てきしん",id:"Tekishin / Teishin - Potong pucuk"},{jp:"灌水",kana:"かんすい",id:"Kansui - Pengairan"},{jp:"輪作",kana:"りんさく",id:"Rinsaku - Rotasi tanam"},{jp:"株間",kana:"かぶま",id:"Kabuma - Jarak antar tanaman"}],quiz:[{q:"Tujuan mabiki (penjarangan) adalah...",options:["Agar tanaman berdesakan","Memberi ruang & cahaya untuk bibit unggul tumbuh optimal","Menghabiskan benih","Agar cepat panen meski kecil"],correct:1,explain:"Mabiki = seleksi. Sisakan yang sehat, buang yang lemah/kembar."},{q:"Teishin pada tomat dilakukan untuk...",options:["Membuat tanaman setinggi mungkin","Menghentikan pertumbuhan tinggi agar nutrisi ke buah","Membuat daun lebih banyak","Mengundang hama"],correct:1,explain:"Teishin = hentikan tinggi. Kalau tidak dipotong, energi habis untuk daun, bukan buah."},{q:"Waktu terbaik untuk kansui (penyiraman) adalah...",options:["Siang jam 12 terik","Pagi hari atau sore hari","Tengah malam","Saat hujan deras"],correct:1,explain:"Siang terik = air cepat menguap & daun bisa terbakar. Pagi/sore ideal."},{q:"Keuntungan irigasi tetes (tenteki) adalah...",options:["Boros air","Hemat air dan langsung ke akar, kurangi gulma","Membuat daun basah terus","Mahal dan tidak efisien"],correct:1,explain:"Tenteki = efisien, air langsung ke akar, daun tetap kering jadi tidak jamuran."},{q:"Jika terus menanam Solanaceae di lahan sama 3 tahun, risikonya...",options:["Tanah makin subur","Hama & penyakit spesifik menumpuk, hasil turun","Tidak ada efek","Panen makin banyak"],correct:1,explain:"Itulah kenapa rinsaku (rotasi) beda famili wajib. Jawaban ujian selalu ini."},{q:"Mekaki adalah membuang...",options:["Buah utama","Tunas samping di ketiak daun","Akar","Semua daun"],correct:1,explain:"Waki me = tunas ketiak. Mekaki = buang tunas ketiak agar tidak jadi cabang liar."}],tips:["Hafal 3 potongan: teishin = pucuk, mekaki = samping, mabiki = buang bibit lemah.","Soal jarak: jawaban aman = 'agar cahaya & angin masuk, cegah penyakit'."]},{id:"E",label:"Hama, Gulma & Pupuk",short:"E",icon:wr,summary:["N-P-K: N (chisso) untuk daun/batang, P (rinsan) untuk bunga/buah/akar, K (kari) untuk kekuatan & rasa manis & tahan penyakit.","Jenis pupuk: Kompos (taihi dari daun/ranting), Kandang (kyuuhi dari kotoran hewan), Kimia (kagaku hirou) cepat serap tapi jangan berlebihan.","Pestisida: Insektisida (satchuuzai) untuk serangga, Fungisida (sakkinzai) untuk jamur, Herbisida (josouzai) untuk gulma.","Aturan dosis: ikuti label, jangan tambah dosis sendiri! Masa tunggu panen (shukaku mae nissuu) wajib dipatuhi agar residu hilang.","Gulma: cabut manual (te de josou), pakai mulsa, atau herbisida selektif. Jangan biarkan berbunga dan berbiji."],memory:[{title:"N-P-K - Hafalan Wajib Ujian",type:"table",data:{headers:["Unsur","Fungsi","Kekurangan"],rows:[["N - Chisso","Daun & batang hijau lebat","Daun kuning, kerdil"],["P - Rinsan","Bunga, buah, akar kuat","Bunga rontok, akar lemah"],["K - Kari","Manis, tahan penyakit & dingin","Tepi daun coklat, mudah sakit"]]}},{title:"3 Jenis Hirou",type:"cards",data:[{name:"Taihi / Kompos",desc:"Dari sisa tanaman, perbaiki struktur tanah",icon:"\uD83C\uDF42"},{name:"Kyuuhi / Kandang",desc:"Kotoran sapi/ayam, N tinggi",icon:"\uD83D\uDC04"},{name:"Kagaku Hirou",desc:"NPK kimia, cepat tapi hati-hati dosis",icon:"\uD83E\uDDEA"}]},{title:"3 Jenis Nouyaku",type:"cards",data:[{name:"Satchuuzai",desc:"Insektisida - bunuh serangga",icon:"\uD83D\uDC1B"},{name:"Sakkinzai",desc:"Fungisida - bunuh jamur",icon:"\uD83C\uDF44"},{name:"Josouzai",desc:"Herbisida - bunuh gulma",icon:"\uD83C\uDF3E"}]}],vocab:[{jp:"肥料",kana:"ひりょう",id:"Hirou - Pupuk"},{jp:"窒素",kana:"ちっそ",id:"Chisso - Nitrogen N"},{jp:"殺虫剤",kana:"さっちゅうざい",id:"Satchuuzai - Insektisida"},{jp:"除草剤",kana:"じょそうざい",id:"Josouzai - Herbisida"},{jp:"収穫前日数",kana:"しゅうかくまえにっすう",id:"Shukaku mae nissuu - Masa tunggu panen"}],quiz:[{q:"Jika daun kuning dan pertumbuhan kerdil, kekurangan unsur...",options:["K - Kari","N - Chisso","P - Rinsan","Air saja"],correct:1,explain:"N untuk daun. Kuning = kurang N. Ujian sering keluar gejala ini."},{q:"Pupuk kandang (kyuuhi) cirinya...",options:["Tidak berbau dan langsung terserap","Dari kotoran hewan, kaya N, perlu fermentasi matang","Hanya mengandung K saja","Buatan pabrik 100%"],correct:1,explain:"Kyuuhi harus matang/fermentasi agar tidak bawa penyakit dan tidak panas merusak akar."},{q:"Untuk membasmi ulat pada daun kubis, pakai...",options:["Josouzai","Sakkinzai","Satchuuzai","Kagaku hirou"],correct:2,explain:"Ulat = mushi = serangga = satchuuzai. Jamur = sakkinzai, gulma = josouzai."},{q:"Aturan dosis nouyaku yang benar...",options:["Tambah 2x lipat biar cepat mati hamanya","Ikuti label persis, jangan lebih, perhatikan masa tunggu panen","Campur semua jenis jadi satu","Semprot setiap hari"],correct:1,explain:"Dosis lebih = residu berbahaya & merusak lingkungan. Shukaku mae nissuu wajib!"},{q:"Masa tunggu panen (shukaku mae nissuu) bertujuan...",options:["Agar harga naik","Agar residu pestisida hilang dan aman dimakan","Agar buah lebih kecil","Tidak ada tujuan"],correct:1,explain:"Ini poin penting keselamatan pangan. Ujian teori pasti keluar."},{q:"Pengendalian gulma paling aman tanpa kimia adalah...",options:["Biarkan berbunga","Cabut manual + mulsa","Siram bensin","Bakar lahan"],correct:1,explain:"Manual + maruchi adalah jawaban eco dan aman yang disukai soal SSW."}],tips:["Hafal NPK dengan: N=Daun, P=Buah/Bunga, K=Kuat/Manis.","Satchu = serangga, Sakkin = jamur (kinoko), Josou = gulma (kusa).","Soal dosis: selalu jawab 'ikuti label & patuhi masa tunggu'."]},{id:"F",label:"Panen & Penyimpanan",short:"F",icon:Nr,summary:["Panen hati-hati: jangan tarik kasar, gunakan gunting / pisau bersih (hasami), panen pagi/sore saat sejuk, hindari memar.","Sortasi & grading: pisahkan berdasarkan ukuran (ookisa), warna, bentuk, kerusakan. Buang yang sakit untuk cegah menular.","Suhu simpan: sayur daun (hourensou, komatsuna) 0-5°C, sayur buah (tomat, kyuuri) 7-10°C, umbi (jagaimo) 10-15°C kering & gelap.","Pengemasan: pakai kardus bersih, beri ventilasi, jangan tumpuk terlalu tinggi, label tanggal panen & nama produk.","Kebersihan pasca panen: cuci alat, cuci tangan, simpan di tempat bersih & sejuk, hindari sinar matahari langsung."],memory:[{title:"Suhu Simpan - Sering Keluar Ujian!",type:"table",data:{headers:["Jenis Sayur","Suhu Simpan","Catatan"],rows:[["Daun: Hourensou","0-5°C","Cepat layu, simpan dingin & lembap"],["Buah: Tomat, Kyuuri","7-10°C","Jangan terlalu dingin, chilling injury"],["Umbi: Jagaimo","10-15°C","Gelap & kering, cegah bertunas"],["Semua","Bersih & ventilasi","Jangan tumpuk berat"]]}},{title:"Alur Panen Benar",type:"cards",data:[{name:"1. Waktu",desc:"Pagi/sore sejuk, tidak hujan",icon:"\uD83C\uDF05"},{name:"2. Alat",desc:"Hasami bersih & tajam",icon:"✂️"},{name:"3. Sortasi",desc:"Grading ukuran & kualitas",icon:"\uD83D\uDCE6"},{name:"4. Packing",desc:"Kardus bersih + label",icon:"\uD83C\uDFF7️"}]}],vocab:[{jp:"収穫",kana:"しゅうかく",id:"Shukaku - Panen"},{jp:"選別",kana:"せんべつ",id:"Senbetsu - Sortasi / Grading"},{jp:"貯蔵",kana:"ちょぞう",id:"Chozo - Penyimpanan"},{jp:"梱包",kana:"こんぽう",id:"Konpou - Pengemasan"},{jp:"鮮度",kana:"せんど",id:"Sendo - Kesegaran"}],quiz:[{q:"Waktu panen terbaik untuk menjaga sendo (kesegaran) adalah...",options:["Siang bolong panas terik","Pagi atau sore saat sejuk","Tengah malam hujan","Kapan saja sama"],correct:1,explain:"Pagi/sore = suhu rendah, penguapan sedikit, sayur tetap segar."},{q:"Hourensou (bayam jepang) sebaiknya disimpan di...",options:["30°C di bawah sinar matahari","0-5°C dingin & lembap","10-15°C kering & gelap","Dibiarkan di lahan"],correct:1,explain:"Sayur daun cepat layu, butuh dingin 0-5°C."},{q:"Tomat disimpan di suhu terlalu rendah (0°C) akan...",options:["Makin manis","Chilling injury - lembek & rasa hilang","Tahan 1 tahun","Tidak masalah"],correct:1,explain:"Sayur buah tidak tahan dingin ekstrem. Suhu ideal 7-10°C."},{q:"Tujuan senbetsu / grading setelah panen...",options:["Biar kerjaan banyak","Pisahkan kualitas agar harga sesuai & cegah penularan busuk","Buang semua hasil","Campur semua jadi satu"],correct:1,explain:"Grading = nilai jual & keamanan pangan. Yang busuk harus dipisah."},{q:"Saat pengemasan kardus, yang benar...",options:["Tumpuk setinggi mungkin biar muat banyak","Beri ventilasi, jangan tindih berat, label jelas","Pakai kardus bekas oli","Tidak perlu label"],correct:1,explain:"Ventilasi cegah panas & busuk, label untuk traceability."}],tips:["Ingat suhu: Daun 0-5, Buah 7-10, Umbi 10-15. Ini keluar terus di choukai!","Kata kunci panen: yasashiku (lembut), kizu tsukenai (jangan lukai), asa/yuugata (pagi/sore)."]},{id:"BONUS",label:"Bonus Choukai",short:"JP",icon:yt,summary:["Di ujian choukai (mendengarkan), kosakata pertanian diulang-ulang. Hafal 20 kata ini = 50% soal lebih mudah.","Fokus pada kata kerja: toru (ambil/panen), maku (tabur), yaru (siram), toru = ambil, mu = cabut gulma.","Dengarkan angka: ichi, ni, san... terutama untuk suhu, dosis, jarak tanam. Sering menjebak.","Kalimat kunci: '...shite kudasai' = tolong lakukan..., '...shite wa ikemasen' = tidak boleh melakukan..."],memory:[{title:"20 Kosakata Emas Choukai - Wajib Hafal",type:"table",data:{headers:["Jepang","Kana","Arti - Konteks Ujian"],rows:[["野菜","やさい","Yasai - Sayuran (umum)"],["農薬","のうやく","Nouyaku - Pestisida"],["肥料","ひりょう","Hirou - Pupuk"],["手袋","てぶくろ","Teebukuro - Sarung tangan APD"],["帽子","ぼうし","Boushi - Topi / Helm"],["トラクター","とらくたー","Torakuta - Traktor"],["収穫","しゅうかく","Shukaku - Panen"],["種","たね","Tane - Benih"],["苗","なえ","Nae - Bibit pindah tanam"],["除草","じょそう","Josou - Penyiangan gulma"],["灌水","かんすい","Kansui - Penyiraman"],["ハウス","はうす","Hausu - Greenhouse"],["選別","せんべつ","Senbetsu - Sortasi"],["安全","あんぜん","Anzen - Keselamatan"],["点検","てんけん","Tenken - Cek alat"],["温度","おんど","Ondo - Suhu"],["湿度","しつど","Shitsudo - Kelembapan"],["間引き","まびき","Mabiki - Penjarangan"],["殺虫剤","さっちゅうざい","Satchuuzai - Insektisida"],["堆肥","たいひ","Taihi - Kompos"]]}},{title:"Pola Kalimat Jebakan",type:"cards",data:[{name:"...te wa ikemasen",desc:"Tidak boleh... (larangan)",icon:"\uD83D\uDEAB"},{name:"...nakereba narimasen",desc:"Harus... (kewajiban)",icon:"✅"},{name:"...mae ni",desc:"Sebelum... (cek dulu)",icon:"⏰"},{name:"Ki wo tsukete",desc:"Hati-hati!",icon:"⚠️"}]}],vocab:[{jp:"〜してはいけません",kana:"〜してはいけません",id:"Tidak boleh melakukan ~"},{jp:"〜なければなりません",kana:"〜なければなりません",id:"Harus melakukan ~"},{jp:"気をつけて",kana:"きをつけて",id:"Ki wo tsukete - Hati-hati"},{jp:"ゆっくり",kana:"ゆっくり",id:"Yukkuri - Pelan-pelan"}],quiz:[{q:"Choukai: 'Nouyaku wo maku mae ni, boushi to teebukuro wo tsukete kudasai' artinya...",options:["Setelah semprot pakai topi","Sebelum semprot pestisida, pakai topi dan sarung tangan","Jangan pakai topi","Boushi tidak penting"],correct:1,explain:"Mae ni = sebelum. Tsukete kudasai = tolong pakai. Ini pola wajib."},{q:"'Koko de tabako wo sutte wa ikemasen' artinya...",options:["Silakan merokok di sini","Dilarang merokok di sini","Rokoknya enak","Merokok menyehatkan"],correct:1,explain:"Te wa ikemasen = larangan keras. Sering keluar di soal keselamatan."},{q:"Kata 'yasai' dalam choukai mengacu pada...",options:["Alat","Sayuran","Pupuk","Traktor"],correct:1,explain:"Yasai = sayuran. Dasar banget tapi sering salah dengar jadi yasashii."},{q:"Jika dengar 'ondo ga takai desu, kanki shite kudasai', apa yang harus dilakukan?",options:["Tutup hausu rapat","Ventilasi / buka jendela hausu karena suhu tinggi","Siram air panas","Matikan lampu"],correct:1,explain:"Ondo takai = suhu tinggi, kanki = ventilasi. Jawaban standar bab C."},{q:"Mana yang termasuk 'hirou'?",options:["Teebukuro","Taihi, kyuuhi, kagaku hirou","Torakuta","Boushi"],correct:1,explain:"Hirou = pupuk. Taihi kompos, kyuuhi kandang, kagaku kimia."},{q:"Choukai: 'Shukaku mae nissuu wo mamotte kudasai' artinya...",options:["Panen secepatnya","Patuhi masa tunggu panen setelah semprot pestisida","Jangan panen","Panen malam hari"],correct:1,explain:"Mamoru = patuhi. Shukaku mae nissuu = masa aman setelah pestisida. Wajib hafal!"}],tips:["Dengarkan kata kunci di akhir kalimat: ...kudasai (tolong), ...ikemasen (dilarang), ...naranai (harus).","Angka suhu: 0-5, 7-10, 10-15 selalu keluar. Catat di kertas coretan saat choukai.","Jika tidak paham, jawab yang paling aman (APD lengkap, ikuti label, ventilasi)."]}];function xu(){let[e,n]=Re.useState("A"),[t,r]=Re.useState({}),[a,i]=Re.useState(!1),[l,u]=Re.useState(null),o=Re.useMemo(()=>fe.find((c)=>c.id===e)||fe[0],[e]),d=Re.useMemo(()=>fe.reduce((c,k)=>c+k.quiz.length,0),[]),g=Re.useMemo(()=>{let c=0;return Object.values(t).forEach((k)=>{c+=Object.keys(k).length}),c},[t]),v=Re.useMemo(()=>{let c=0;return fe.forEach((k)=>{let S=t[k.id];if(!S)return;k.quiz.forEach((x,_)=>{if(S[_]?.selected===x.correct)c++})}),c},[t]),h=d?Math.round(g/d*100):0,E=(c)=>{let k=fe.find((x)=>x.id===c),S=t[c];if(!S)return 0;return Math.round(Object.keys(S).length/k.quiz.length*100)},N=(c)=>{let k=fe.find((_)=>_.id===c),S=t[c];if(!S)return{correct:0,total:k.quiz.length};let x=0;return k.quiz.forEach((_,D)=>{if(S[D]?.selected===_.correct)x++}),{correct:x,total:k.quiz.length}},P=(c,k,S)=>{r((x)=>({...x,[c]:{...x[c]||{},[k]:{selected:S,revealed:!0}}}))},B=(c)=>{u(c),setTimeout(()=>u(null),2200)},p=()=>{let c=fe.findIndex((k)=>k.id===e);if(c<fe.length-1){let k=fe[c+1];n(k.id),B(`Lanjut ke Bab ${k.id}`)}else i(!0),B("Buka Rekap Skor");window.scrollTo({top:0,behavior:"smooth"})},[s,f]=Re.useState(null);return y("div",{className:"min-h-screen bg-[#FFF8E1] text-[#1B2A1B] selection:bg-[#2E7D32]/20 overflow-x-hidden",children:[m("style",{children:`@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap');
